[package]
name = "freedesktop-icons"
version = "0.4.0"
edition = "2024"

license = "MIT"
description = "Icons lookup crate"
repository = "https://github.com/id3v1669/freedestkop-icons"
readme = "README.md"
keywords = ["icons", "gui", "lookup"]

[dependencies]
bstr = "1.12.3"
btoi = "0.5.0"
dirs = "6.0.0"
memchr = "2.8.2"
memmap2 = "0.9.11"
once_cell = "1.21.4"
tracing = "0.1.44"
xdg = "3.0.0"

[dev-dependencies]
speculoos = "0.13.0"
linicon = "2.3.0"
gtk4 = "0.11.4"
criterion = "0.8.2"

[features]
default = []
local_tests = []

[[bench]]
name = "simple_lookup"
harness = false
